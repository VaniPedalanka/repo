<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sivalingam UI</title>
    <style>
        
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(to bottom, #2c3e50, #bdc3c7);
        }
.name{

        padding:40px;
        width: 10px;
    margin-top:-250px ;
    font-size: large;
    
}
        .sivalingam-container {
            position: relative;
            width: 1500px;
            height: 300px;
        }

       
        .base {
            position: absolute;
            bottom: 0;
            width: 200px;
            height: 62px;
            background: #4a4a4a;
            border-radius: 10px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.3);
        }

       
        .pedestal {
            position: absolute;
            bottom: 60px;
            width: 150px;
            height: 42px;
            background: #6e6e6e;
            border-radius: 10px;
            left: 25px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
        }

       
        .lingam {
            position: absolute;
            bottom: 100px;
            width: 80px;
            height: 150px;
            background: black;
            border-radius: 50% 50% 0 0;
            left: 60px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.5);
        }

        
        .lingam-marking {
            position: absolute;
            top: 28px;
            left: 10px;
            width: 60px;
            height: 5px;
            background: white;
            border-radius: 20%;
        }
        .stripe{
            position: absolute;
            bottom: 110px;
            left: 10px;
            width: 60px;
            height: 5px;
            background: white;
            border-radius: 20%;

        }
        .stripes{
            position: absolute;
            bottom: 103px;
            left: 10px;
            width: 60px;
            height: 5px;
            background: white;
            border-radius: 20%;
        }
    </style>
</head>
<body><div>
    <div class="name"> <h2>SHIVALINGAM</h2></div>
    </div>
    <div class="sivalingam-container">
        <div class="base"></div>
        <div class="pedestal"></div>
        <div class="lingam">
            <div class="lingam-marking"></div>
            <div class="stripe"></div>
            <div class="stripes"></div> 
            
        </div>
    </div>
</body>
</html>
